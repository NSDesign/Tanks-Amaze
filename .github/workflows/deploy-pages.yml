name: Deploy to GitHub Pages

# Redeploys the game site on every successful push of the game code.
on:
  push:
    branches: [main, master, claude/amazing-tesla-thsw5c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp asset URLs for cache busting
        # Browsers and the Pages CDN cache css/js aggressively; versioning
        # the URLs guarantees every deploy is picked up on the next load.
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s|(href=\"css/style\.css)|\1?v=${V}|; s|(src=\"js/[a-z]+\.js)|\1?v=${V}|g" index.html
          grep -E "\?v=${V}" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run if it doesn't exist yet
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The game is static files at the repo root — no build step
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

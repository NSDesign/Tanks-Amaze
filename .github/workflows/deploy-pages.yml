name: Deploy to GitHub Pages

# Redeploys the game site on every successful push of the game code.
on:
  push:
    branches: [main, master, claude/amazing-tesla-thsw5c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run if it doesn't exist yet
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The game is static files at the repo root — no build step
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
